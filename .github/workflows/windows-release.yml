name: Gerar aplicativo Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release.yml'
      - 'lib/**'
      - 'windows/**'
      - 'scripts/**'
      - 'test/**'
      - 'pubspec.*'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Compilar e verificar Windows x64
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Instalar Flutter 3.41.4
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch 3.41.4 https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao baixar o Flutter.' }
          $revision = git -C $sdk rev-parse HEAD
          if ($revision -ne 'ff37bef603469fb030f2b72995ab929ccfc227f0') { throw 'Revisao do Flutter inesperada.' }
          Join-Path $sdk 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $sdk 'bin\flutter.bat') --version
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao inicializar o Flutter.' }

      - name: Compilar, testar e empacotar
        run: ./scripts/build_windows.ps1

      - name: Verificar o executavel e a inicializacao automatica
        run: |
          ./scripts/test_windows_startup.ps1 -AppPath ./dist/LC-Carga-Windows/license_generator_app.exe -ColdStartup

      - name: Encerrar o aplicativo de teste
        if: always()
        run: |
          Get-Process -Name 'license_generator_app' -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -like "$env:GITHUB_WORKSPACE\dist\LC-Carga-Windows\*" } |
            Stop-Process -Force
          Remove-ItemProperty -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'LCCargaServer' -ErrorAction SilentlyContinue

      - name: Disponibilizar o pacote Windows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LC-Carga-Windows-x64
          path: dist/LC-Carga-Windows.zip
          if-no-files-found: error
          retention-days: 14
